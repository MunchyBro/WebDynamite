name: Core Service

on:
  push:
    branches: [main, phase-1-core-service, phase-2-website-management]
    paths:
      - "Cargo.toml"
      - "core-service/**"
      - ".github/workflows/core-service.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "core-service/**"
      - ".github/workflows/core-service.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Core Service
        run: cargo test --manifest-path core-service/Cargo.toml
