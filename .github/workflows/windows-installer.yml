name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "core-service/**"
      - "src-tauri/**"
      - "scripts/windows/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Reject unsigned tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          throw "WebDynamite release publication is blocked: the production signing pipeline is not implemented. Do not distribute this unsigned installer. Use a reviewed signing-enabled release workflow only after desktop, Core Service, and final NSIS signatures are verified against the protected publisher pin."

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate service provisioning contract
        shell: pwsh
        run: ./scripts/windows/provision-service-layout.ps1 -Mode SelfTest

      - name: Validate signing certificate preflight contract
        shell: pwsh
        run: ./scripts/windows/validate-signing-certificate.ps1 -SelfTest

      - name: Validate service binary signature preflight contract
        shell: pwsh
        run: ./scripts/windows/verify-service-binary.ps1 -SelfTest

      - name: Validate native branding assets
        shell: pwsh
        run: ./scripts/windows/validate-brand-assets.ps1

      - name: Install frontend dependencies
        run: npm install

      - name: Build bundled Core Service
        run: cargo build --release --manifest-path core-service/Cargo.toml

      - name: Build WebDynamite NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDynamite-Windows-Installer
          path: "**/bundle/nsis/*.exe"
          if-no-files-found: error
          retention-days: 30
