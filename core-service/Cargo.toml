[package]
name = "webdynamite-core"
version = "0.1.0"
edition = "2021"
description = "WebDynamite local hosting control service"

[[bin]]
name = "webdynamite-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio-postgres = "0.7"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql"] }
