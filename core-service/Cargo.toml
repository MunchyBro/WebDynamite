[package]
name = "webdynamite-core"
version = "0.1.0"
edition = "2021"
description = "WebDynamite local hosting control service"

[[bin]]
name = "webdynamite-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
zeroize = "1"
tokio-postgres = "0.7"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Services"] }

[target.'cfg(windows)'.dependencies]
verifysign = "1.0.1"
